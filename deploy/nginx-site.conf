# Included by Hestia's domain-specific nginx.conf_* and nginx.ssl.conf_* hooks.
# Keep the generated Hestia virtual host intact.
location = / { rewrite ^ /index.html last; }
location = /index.html {
    root /home/noox/web/sheepraider.nooxtools.me/public_html;
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
location = /play { return 301 /play/; }
location ^~ /play/ {
    root /home/noox/web/sheepraider.nooxtools.me/public_html;
    index index.html;
    try_files $uri $uri/ =404;
    types { text/html html; application/javascript js; application/wasm wasm; application/octet-stream pck; image/png png; }
    gzip_static on;
    gzip_vary on;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control "no-cache" always;
}
location ^~ /site-assets/ {
    root /home/noox/web/sheepraider.nooxtools.me/public_html;
    try_files $uri =404;
    expires 1d;
}
location = /downloads/latest.json {
    root /home/noox/web/sheepraider.nooxtools.me/public_html;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
}
location ^~ /downloads/ {
    root /home/noox/web/sheepraider.nooxtools.me/public_html;
    try_files $uri =404;
    types { application/zip zip; application/vnd.android.package-archive apk; text/plain txt; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Disposition attachment always;
}
location ^~ /updates/stable/ {
    root /home/noox/web/sheepraider.nooxtools.me/public_html;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
}
location ^~ /updates/releases/ {
    root /home/noox/web/sheepraider.nooxtools.me/public_html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location = /updates { return 404; }
location = /updates/ { return 404; }
